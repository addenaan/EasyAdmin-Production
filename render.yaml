services:
  - type: web
    name: easy-admin-supabase
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EASYADMIN_OPENAI_MODEL
        value: gpt-5.4-mini
      - key: EASYADMIN_AI_MAX_LINES_PER_RUN
        value: "100"
      - key: EASYADMIN_OPENAI_TIMEOUT_SECONDS
        value: "60"
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
    disk:
      name: easy-admin-uploads
      mountPath: /var/data
      sizeGB: 1
