<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | Easy Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; }
        .password-card { max-width: 520px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.12); overflow: hidden; }
        .card-header-custom { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; padding: 26px; }
        .logo-box { width: 64px; height: 64px; border-radius: 14px; background: white; display: flex; align-items: center; justify-content: center; padding: 8px; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .btn-primary { font-weight: 700; }
    </style>
</head>
<body>
    <main class="container d-flex justify-content-center">
        <div class="card password-card">
            <div class="card-header-custom d-flex align-items-center gap-3">
                <div class="logo-box"><img src="/static/easy_admin_logo.png" alt="Easy Admin"></div>
                <div>
                    <div class="small opacity-75">Easy Admin</div>
                    <h2 class="mb-0 fw-bold">Change Password</h2>
                    <div class="small opacity-75">Signed in as {{ session.get('username', 'User') }}</div>
                </div>
            </div>
            <div class="card-body p-4">
                {% if success_msg %}<div class="alert alert-success">{{ success_msg }}</div>{% endif %}
                {% if error_msg %}<div class="alert alert-danger">{{ error_msg }}</div>{% endif %}
                <form method="post" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Current password</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">New password</label>
                        <input type="password" name="new_password" class="form-control" minlength="8" required>
                        <div class="form-text">Use at least 8 characters.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Confirm new password</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                    </div>
                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-primary flex-fill">Change Password</button>
                        {% if session.get('is_staff') %}
                            <a href="{{ url_for('staff_portal') }}" class="btn btn-outline-secondary flex-fill">Back to Staff Portal</a>
                        {% else %}
                            <a href="{{ url_for('hub') }}" class="btn btn-outline-secondary flex-fill">Back to Hub</a>
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
